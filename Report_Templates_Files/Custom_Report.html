
<!-- TEMPLATE_NAME: Custom Report (Simplified) -->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ 'Custom Report' }}</title>

    <style>
        /* Core Variables */
        :root {
            --primary-blue: {{ brand_blue | default('#0d264f') }};
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --bg-light: #f9fafb;
        }

        /* Page Setup */
        @page {
            size: A4;
            margin: 2cm;

            @bottom-left {
                {% if doc_ref %}
                content: "Ref: {{ doc_ref }}";
                {% else %}
                content: "";
                {% endif %}
                font-size: 9pt;
                color: var(--text-light);
            }
            @bottom-right {
                content: "Page " counter(page) " of " counter(pages);
                font-size: 9pt;
                color: var(--text-light);
            }
        }

        /* Body */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 11pt;
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Cover Page */
        .cover-page {
            text-align: center;
            padding-top: 80pt;
            page-break-after: always;
        }

        .cover-page .doc-title {
            font-size: 24pt;
            color: var(--primary-blue);
            font-weight: 700;
            margin-bottom: 16pt;
        }

        .cover-page .doc-subtitle {
            font-size: 14pt;
            color: var(--text-light);
            margin-bottom: 40pt;
        }

        .cover-page .meta {
            font-size: 11pt;
            color: var(--text-light);
            line-height: 1.8;
        }

        /* Headings */
        h2 {
            font-size: 18pt;
            color: var(--primary-blue);
            font-weight: 700;
            margin: 32pt 0 16pt;
            padding-bottom: 8pt;
            border-bottom: 2pt solid var(--primary-blue);
            page-break-after: avoid;
        }

        h3 {
            font-size: 14pt;
            color: var(--primary-blue);
            font-weight: 600;
            margin: 24pt 0 12pt;
            page-break-after: avoid;
        }

        h4 {
            font-size: 12pt;
            color: var(--text-dark);
            font-weight: 600;
            margin: 16pt 0 8pt;
            page-break-after: avoid;
        }

        /* Paragraphs */
        p {
            margin: 12pt 0;
            text-align: justify;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20pt 0;
            font-size: 10pt;
            page-break-inside: auto;
        }

        thead {
            display: table-header-group;
        }

        th {
            background-color: var(--primary-blue);
            color: white;
            font-weight: 600;
            padding: 8pt;
            text-align: left;
            border-bottom: 2pt solid var(--primary-blue);
        }

        td {
            padding: 8pt;
            border-bottom: 1pt solid var(--border-color);
            vertical-align: top;
        }

        tbody tr:nth-child(even) {
            background-color: var(--bg-light);
        }

        tr {
            page-break-inside: avoid;
        }

        /* Lists */
        ul, ol {
            margin: 12pt 0;
            padding-left: 24pt;
        }

        li {
            margin: 6pt 0;
        }

        /* Links */
        a {
            color: var(--primary-blue);
            text-decoration: none;
        }

        /* Utility Classes */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .page-break { page-break-after: always; }

        {% if confidential %}
        /* Confidential Watermark */
        @page {
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200"><text x="50%%" y="50%%" font-size="48" font-weight="700" fill="rgba(220,38,38,0.08)" text-anchor="middle" transform="rotate(-45 200 100)">CONFIDENTIAL</text></svg>') center center no-repeat;
        }
        {% endif %}
    </style>
</head>
<body>
    {% if include_cover %}
    <div class="cover-page">
        <div class="doc-title">{{ 'Custom Report' }}</div>
        {% if subtitle %}<div class="doc-subtitle">{{ subtitle }}</div>{% endif %}
        
        <div class="meta">
            <div>Generated: {{ date }}</div>
            {% if doc_ref %}<div>Reference: {{ doc_ref }}</div>{% endif %}
            {% if confidential %}<div style="margin-top: 16pt; color: #dc2626; font-weight: 600;">CONFIDENTIAL</div>{% endif %}
        </div>
    </div>
    {% endif %}

    <div class="content">
        {{ content|safe }}
    </div>
</body>
</html>
